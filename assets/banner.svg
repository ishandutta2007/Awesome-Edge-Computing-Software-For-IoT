<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Keyframe Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-80px); }
    }

    .anim-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .anim-float { animation: float 6s ease-in-out infinite; }
    .anim-dash { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" fill="url(#grid)"/>

  <!-- Dynamic / Animated Background Graphics (Kept behind foreground text) -->
  <g opacity="0.4" class="anim-float">
    <!-- Glowing background Orbs -->
    <circle cx="150" cy="80" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="260" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- Network Circuit Lines & Edge Nodes (Dynamic Graphic Elements) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Pulse Lines -->
    <path d="M 100 280 L 250 280 L 320 220 L 450 220" class="anim-dash"/>
    <path d="M 750 120 L 880 120 L 950 180 L 1100 180" class="anim-dash"/>
    
    <!-- Edge Node Connection Rings -->
    <circle cx="320" cy="220" r="6" fill="#06b6d4"/>
    <circle cx="950" cy="180" r="6" fill="#a855f7"/>
  </g>

  <!-- Edge Device Hardware Cards (Decorative Background Components) -->
  <g transform="translate(900, 50)" class="anim-float" opacity="0.85">
    <rect width="220" height="120" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#glow)"/>
    <rect x="15" y="15" width="40" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="25" y="40" font-family="sans-serif" font-weight="bold" font-size="20" fill="#fff">⚡</text>
    <text x="70" y="33" font-family="sans-serif" font-weight="bold" font-size="14" fill="#f8fafc">Edge Runtime</text>
    <text x="70" y="52" font-family="sans-serif" font-size="12" fill="#64748b">OTA &amp; Orchestration</text>
    
    <rect x="15" y="75" width="190" height="8" rx="4" fill="#334155"/>
    <rect x="15" y="75" width="130" height="8" rx="4" fill="url(#cyanGrad)"/>
    <text x="15" y="100" font-family="sans-serif" font-size="11" fill="#38bdf8">Telemetry Stream Active</text>
  </g>

  <g transform="translate(80, 180)" class="anim-float" opacity="0.75" style="animation-delay: -3s;">
    <rect width="180" height="100" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="14" fill="url(#purpleGrad)"/>
    <text x="60" y="32" font-family="sans-serif" font-weight="bold" font-size="13" fill="#f8fafc">K3s &amp; EdgeX</text>
    <text x="60" y="48" font-family="sans-serif" font-size="11" fill="#64748b">Container Cluster</text>
    <path d="M 20 75 Q 60 55, 100 75 T 160 75" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Foreground Content Container (Guaranteed clear & legible overlay) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="16" y="21" class="badge-text">🌐 AWESOME IOT &amp; EDGE 2026</text>
    </g>

    <!-- Main Title (Bold & Foreground) -->
    <text x="0" y="155" class="title">
      Awesome Edge Computing
    </text>
    <text x="0" y="200" class="title" fill="url(#cyanGrad)">
      Software For IoT
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" class="subtitle">
      Curated Commercial Edge Platforms &amp; Open-Source Edge Runtimes
    </text>

    <!-- Highlights / Key Feature Tokens -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🍓 Edge K8s</text>

      <rect x="142" y="0" width="150" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="154" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🐳 OTA &amp; Containers</text>

      <rect x="304" y="0" width="140" height="26" rx="6" fill="#334155" opacity="0.6"/>
      <text x="316" y="17" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Edge AI &amp; LLM</text>
    </g>
  </g>
</svg>
